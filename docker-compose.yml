services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fireguard-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEMO_MODE=true
      - DATABASE_URL=sqlite:///./backend/fireguard.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fireguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
